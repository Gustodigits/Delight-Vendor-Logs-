<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Studio Admin - Delight Vendor Logs</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6f8;
  color:#111;
}

header{
  background:#050505;
  color:white;
  padding:18px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  position:sticky;
  top:0;
  z-index:20;
}

.header-left{
  display:flex;
  flex-direction:column;
}

.brand{
  font-size:20px;
  font-weight:900;
}

.subtitle{
  font-size:13px;
  color:#aaa;
  margin-top:3px;
}

.back-btn{
  border:0;
  background:#222;
  color:white;
  padding:10px 14px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
}

.container{
  width:min(1100px,94%);
  margin:25px auto 50px;
}

.admin-card{
  background:white;
  border-radius:18px;
  padding:20px;
  box-shadow:0 4px 18px rgba(0,0,0,.07);
  margin-bottom:20px;
}

.admin-card h2{
  margin:0 0 7px;
  font-size:21px;
}

.admin-card p{
  margin:0;
  color:#666;
  font-size:14px;
  line-height:1.5;
}

.status{
  margin-top:15px;
  padding:12px 14px;
  border-radius:10px;
  background:#f1f5f9;
  font-size:14px;
  font-weight:700;
}

.status.success{
  background:#dcfce7;
  color:#166534;
}

.status.error{
  background:#fee2e2;
  color:#991b1b;
}

.status.loading{
  background:#e0f2fe;
  color:#075985;
}

.service-list{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.service-row{
  border:1px solid #e5e7eb;
  border-radius:15px;
  padding:17px;
  background:#fff;
}

.service-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.service-info{
  display:flex;
  align-items:center;
  gap:13px;
  min-width:0;
}

.service-number{
  width:38px;
  height:38px;
  min-width:38px;
  border-radius:10px;
  background:#111;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}

.service-name{
  font-size:16px;
  font-weight:800;
  word-break:break-word;
}

.service-description{
  color:#777;
  font-size:13px;
  margin-top:4px;
}

.controls{
  margin-top:15px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  align-items:end;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field label{
  font-size:12px;
  font-weight:800;
  color:#555;
}

.price-input{
  width:100%;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:16px;
  outline:none;
}

.price-input:focus{
  border-color:#111;
}

.save-btn{
  border:0;
  background:#111;
  color:#fff;
  padding:12px 18px;
  border-radius:10px;
  font-weight:800;
  cursor:pointer;
  min-width:100px;
}

.save-btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.active-row{
  margin-top:13px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding-top:13px;
  border-top:1px solid #eee;
}

.active-text{
  font-size:13px;
  font-weight:700;
}

.switch{
  position:relative;
  width:48px;
  height:27px;
}

.switch input{
  opacity:0;
  width:0;
  height:0;
}

.slider{
  position:absolute;
  inset:0;
  background:#ccc;
  border-radius:30px;
  cursor:pointer;
  transition:.2s;
}

.slider:before{
  content:"";
  position:absolute;
  width:21px;
  height:21px;
  left:3px;
  top:3px;
  background:#fff;
  border-radius:50%;
  transition:.2s;
}

.switch input:checked + .slider{
  background:#111;
}

.switch input:checked + .slider:before{
  transform:translateX(21px);
}

.empty{
  text-align:center;
  padding:35px 15px;
  color:#777;
}

.loading-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px;
  text-align:center;
}

.loading-box{
  background:white;
  padding:25px;
  border-radius:16px;
  box-shadow:0 4px 20px rgba(0,0,0,.08);
}

.hidden{
  display:none !important;
}

@media(max-width:600px){
  header{
    padding:15px 12px;
  }

  .brand{
    font-size:17px;
  }

  .subtitle{
    font-size:11px;
  }

  .back-btn{
    padding:9px 11px;
    font-size:12px;
  }

  .container{
    width:94%;
    margin-top:18px;
  }

  .admin-card{
    padding:16px;
  }

  .service-top{
    align-items:flex-start;
  }

  .controls{
    grid-template-columns:1fr;
  }

  .save-btn{
    width:100%;
  }
}
</style>
</head>

<body>

<div id="loadingScreen" class="loading-screen">
  <div class="loading-box">
    <h3>Checking admin access...</h3>
    <p>Please wait.</p>
  </div>
</div>

<div id="app" class="hidden">

<header>
  <div class="header-left">
    <div class="brand">⚡ Delight Vendor Logs</div>
    <div class="subtitle">AI Studio Admin</div>
  </div>

  <button class="back-btn" onclick="goBack()">
    ← Dashboard
  </button>
</header>

<main class="container">

  <div class="admin-card">
    <h2>🤖 AI Services</h2>

    <p>
      Manage AI service prices and availability from here.
      Changes are saved directly to the AI services database.
    </p>

    <div id="statusBox" class="status">
      Loading AI services...
    </div>
  </div>

  <div class="admin-card">
    <div id="serviceList" class="service-list">
    </div>
  </div>

</main>

</div>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://hkfhehbhmucymusaytoe.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   ELEMENTS
========================================================= */

const loadingScreen =
  document.getElementById("loadingScreen");

const app =
  document.getElementById("app");

const serviceList =
  document.getElementById("serviceList");

const statusBox =
  document.getElementById("statusBox");


/* =========================================================
   HELPERS
========================================================= */

function showStatus(message, type = ""){
  statusBox.textContent = message;
  statusBox.className = "status " + type;
}


function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function goBack(){
  window.location.href = "dashboard.html";
}


/* =========================================================
   ADMIN CHECK
========================================================= */

async function checkAdmin(){

  try{

    const {
      data:sessionData,
      error:sessionError
    } = await supabaseClient.auth.getSession();

    if(sessionError){
      throw sessionError;
    }

    const session =
      sessionData?.session;

    if(!session){

      window.location.href =
        "login.html";

      return false;
    }


    const user =
      session.user;

    if(!user){

      window.location.href =
        "login.html";

      return false;
    }


    /*
      IMPORTANT:

      This checks the existing admin_users
      table.

      Database RLS should also use the
      public.is_admin() security function.
    */

    const {
      data:adminData,
      error:adminError
    } = await supabaseClient
      .from("admin_users")
      .select("user_id")
      .eq("user_id", user.id)
      .maybeSingle();


    if(adminError){

      console.error(
        "Admin check error:",
        adminError
      );

      showStatus(
        "Unable to verify admin access.",
        "error"
      );

      return false;
    }


    if(!adminData){

      alert(
        "Access denied. Admin account required."
      );

      window.location.href =
        "dashboard.html";

      return false;
    }


    return true;

  }catch(error){

    console.error(error);

    alert(
      "Unable to verify your account."
    );

    window.location.href =
      "login.html";

    return false;
  }
}


/* =========================================================
   LOAD SERVICES
========================================================= */

async function loadServices(){

  showStatus(
    "Loading AI services...",
    "loading"
  );

  const {
    data,
    error
  } = await supabaseClient
    .from("ai_services")
    .select(
      "id,name,description,price,is_active,sort_order"
    )
    .order(
      "sort_order",
      {ascending:true}
    );


  if(error){

    console.error(error);

    showStatus(
      "Could not load AI services: " +
      error.message,
      "error"
    );

    return;
  }


  if(!data || data.length === 0){

    serviceList.innerHTML = `
      <div class="empty">
        No AI services found.
      </div>
    `;

    showStatus(
      "No AI services found.",
      "error"
    );

    return;
  }


  serviceList.innerHTML =
    data.map((service,index) => {

      const price =
        Number(service.price || 0);

      return `
        <div class="service-row">

          <div class="service-top">

            <div class="service-info">

              <div class="service-number">
                ${index + 1}
              </div>

              <div>

                <div class="service-name">
                  ${escapeHtml(service.name)}
                </div>

                <div class="service-description">
                  ${escapeHtml(
                    service.description ||
                    "AI service"
                  )}
                </div>

              </div>

            </div>

          </div>


          <div class="controls">

            <div class="field">

              <label>
                PRICE (₦)
              </label>

              <input
                id="price-${service.id}"
                class="price-input"
                type="number"
                min="0"
                step="0.01"
                value="${price.toFixed(2)}"
              >

            </div>

            <button
              class="save-btn"
              id="save-${service.id}"
              onclick="saveService('${service.id}')"
            >
              Save
            </button>

          </div>


          <div class="active-row">

            <div class="active-text">
              ${service.is_active
                ? "Service is active"
                : "Service is disabled"}
            </div>

            <label class="switch">

              <input
                id="active-${service.id}"
                type="checkbox"
                ${service.is_active ? "checked" : ""}
                onchange="toggleService('${service.id}', this.checked)"
              >

              <span class="slider"></span>

            </label>

          </div>

        </div>
      `;

    }).join("");


  showStatus(
    `${data.length} AI services loaded.`,
    "success"
  );
}


/* =========================================================
   SAVE PRICE
========================================================= */

async function saveService(serviceId){

  const input =
    document.getElementById(
      "price-" + serviceId
    );

  const button =
    document.getElementById(
      "save-" + serviceId
    );

  if(!input || !button){
    return;
  }


  const price =
    Number(input.value);


  if(!Number.isFinite(price) || price < 0){

    alert(
      "Please enter a valid price."
    );

    return;
  }


  button.disabled = true;
  button.textContent = "Saving...";


  try{

    const {
      data:sessionData,
      error:sessionError
    } =
      await supabaseClient.auth.getSession();


    if(sessionError){
      throw sessionError;
    }


    if(!sessionData?.session){

      window.location.href =
        "login.html";

      return;
    }


    const {
      error
    } = await supabaseClient
      .from("ai_services")
      .update({
        price: price,
        updated_at: new Date().toISOString()
      })
      .eq("id", serviceId);


    if(error){
      throw error;
    }


    showStatus(
      "Price saved successfully.",
      "success"
    );


    button.textContent =
      "Saved ✓";


    setTimeout(() => {

      button.textContent =
        "Save";

      button.disabled =
        false;

    },1200);


  }catch(error){

    console.error(error);

    alert(
      "Could not save price:\n" +
      error.message
    );

    button.textContent =
      "Save";

    button.disabled =
      false;

  }
}


/* =========================================================
   ENABLE / DISABLE SERVICE
========================================================= */

async function toggleService(
  serviceId,
  isActive
){

  try{

    const {
      error
    } = await supabaseClient
      .from("ai_services")
      .update({
        is_active: isActive,
        updated_at: new Date().toISOString()
      })
      .eq("id", serviceId);


    if(error){
      throw error;
    }


    showStatus(
      isActive
        ? "AI service enabled."
        : "AI service disabled.",
      "success"
    );


    /*
      Update visible text.
    */

    const checkbox =
      document.getElementById(
        "active-" + serviceId
      );

    if(checkbox){

      const parent =
        checkbox.closest(".active-row");

      if(parent){

        const text =
          parent.querySelector(
            ".active-text"
          );

        if(text){

          text.textContent =
            isActive
              ? "Service is active"
              : "Service is disabled";

        }

      }

    }


  }catch(error){

    console.error(error);

    alert(
      "Could not update service:\n" +
      error.message
    );


    /*
      Revert checkbox if database update failed.
    */

    const checkbox =
      document.getElementById(
        "active-" + serviceId
      );

    if(checkbox){

      checkbox.checked =
        !isActive;

    }

  }
}


/* =========================================================
   START
========================================================= */

async function start(){

  const allowed =
    await checkAdmin();

  if(!allowed){
    return;
  }


  loadingScreen.classList.add(
    "hidden"
  );

  app.classList.remove(
    "hidden"
  );


  await loadServices();
}


start();

</script>

</body>
</html>
