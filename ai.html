/* =========================================================
   FIX FOR EMOJI SERVICE NAMES
========================================================= */

function getVisualForService(serviceName){

    if(!serviceName){
        return null;
    }

    if(serviceVisuals[serviceName]){
        return serviceVisuals[serviceName];
    }

    const cleanName =
        String(serviceName)
            .replace(
                /^[^\p{L}\p{N}]+/u,
                ""
            )
            .trim();

    return serviceVisuals[cleanName] || null;
}


/* =========================================================
   MONEY
========================================================= */

function formatMoney(amount){

    return "₦" +
        Number(amount || 0).toLocaleString(
            "en-NG",
            {
                minimumFractionDigits:0,
                maximumFractionDigits:2
            }
        );
}


/* =========================================================
   STATUS
========================================================= */

function showStatus(message,type="info"){

    const box =
        document.getElementById("statusBox");

    box.textContent = message;

    box.className =
        "status show " + type;
}

function hideStatus(){

    const box =
        document.getElementById("statusBox");

    box.className = "status";
}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   AUTH
========================================================= */

async function checkLogin(){

    const {
        data,
        error
    } =
        await supabaseClient.auth.getSession();

    if(error){

        console.error(error);

        window.location.href = "login.html";

        return false;
    }

    if(!data?.session){

        window.location.href = "login.html";

        return false;
    }

    currentUser =
        data.session.user;

    return true;
}


/* =========================================================
   WALLET
========================================================= */

async function loadWallet(){

    if(!currentUser){
        return;
    }

    const {
        data,
        error
    } =
        await supabaseClient
            .from("wallet")
            .select("balance")
            .eq(
                '"user-id"',
                currentUser.id
            )
            .maybeSingle();

    if(error){

        console.error(
            "Wallet error:",
            error
        );

        showStatus(
            "Could not load your wallet balance.",
            "error"
        );

        return;
    }

    walletBalance =
        Number(data?.balance || 0);

    document.getElementById(
        "walletBalance"
    ).textContent =
        formatMoney(walletBalance);
}

========================================================= */

        "Loading AI services...",
        "info"

        error

        await supabaseClient

                "id,name,description,price,is_active,sort_order"

                "sort_order",
                {
                    ascending:true
                }
            );

    if(error){

        console.error(
            "AI services error:",
            error
        );

        showStatus(
            "Could not load AI services.",
            "error"
        );

        return;
    }

    aiServices =
        data || [];

    renderServices();
}

========================================================= */

function renderServices(){

    const container =
        document.getElementById("services");

    if(!aiServices.length){

        container.innerHTML = `
            <div class="empty">
                No AI services are currently available.
            </div>
        `;

        hideStatus();

        return;
    }

    container.innerHTML =
        aiServices.map(service => {

/* =========================================================
   OPEN TOOL
========================================================= */

function openTool(serviceId){

    selectedService =
        aiServices.find(
            service =>
                service.id === serviceId
        );

    if(!selectedService){
        return;
    }

    const visual =
        getVisualForService(
            selectedService.name
        );

    if(!visual){

        alert(
            "This AI service is not configured correctly."
        );

        return;
    }

    document.getElementById(
        "servicePage"
    ).style.display = "none";

    document.getElementById(
        "toolPage"
    ).style.display = "block";

    const icon =
        document.getElementById(
            "toolIcon"
        );

    icon.className =
        "tool-icon-wrap " +
        visual.cls;

    icon.innerHTML =
        visual.svg;

    document.getElementById(
        "toolTitle"
    ).textContent =
        selectedService.name;

    document.getElementById(
        "toolDescription"
    ).textContent =
        selectedService.description ||
        "Complete the form below.";

    document.getElementById(
        "toolPrice"
    ).textContent =
        "Price: " +
        formatMoney(
            selectedService.price
        );

    document.getElementById(
        "resultBox"
    ).classList.remove("show");

    document.getElementById(
        "loadingBox"
    ).classList.remove("show");

    renderToolForm(
        selectedService.name
    );

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

/* =========================================================
   KYC COUNTRIES
========================================================= */

async function loadKycCountries(){

    const select =
        document.getElementById(
            "kycCountry"
        );

    if(!select){
        return;
    }

    const {
        data,
        error
    } =
        await supabaseClient
            .from("kyc_countries")
            .select(
                "id,country_name"
            )
            .eq(
                "is_active",
                true
            )
            .order(
                "country_name"
            );

    if(error){

        console.error(
            "KYC country error:",
            error
        );

        select.innerHTML = `
            <option value="">
                Could not load countries
            </option>
        `;

        return;
    }

    select.innerHTML = `
        <option value="">
            Select country
        </option>
    `;

    (data || []).forEach(country => {

        const option =
            document.createElement(
                "option"
            );

        option.value =
            country.id;

        option.textContent =
            country.country_name;

        select.appendChild(option);
    });

    select.onchange = function(){

        loadKycDocuments(
            this.value
        );

    };
}


/* =========================================================
   KYC DOCUMENTS
========================================================= */

async function loadKycDocuments(countryId){

    const select =
        document.getElementById(
            "kycDocument"
        );

    const fieldsBox =
        document.getElementById(
            "kycFields"
        );

    if(!select){
        return;
    }

    if(fieldsBox){
        fieldsBox.innerHTML = "";
    }

    select.disabled = true;

    select.innerHTML = `
        <option value="">
            Loading document types...
        </option>
    `;

    if(!countryId){

        select.innerHTML = `
            <option value="">
                Select country first
            </option>
        `;

        return;
    }

    const {
        data,
        error
    } =
        await supabaseClient
            .from("kyc_document_types")
            .select(
                "id,document_name"
            )
            .eq(
                "country_id",
                countryId
            )
            .eq(
                "is_active",
                true
            )
            .order(
                "document_name"
            );

    if(error){

        console.error(
            "KYC document error:",
            error
        );

        select.innerHTML = `
            <option value="">
                Could not load documents
            </option>
        `;

        return;
    }

    select.innerHTML = `
        <option value="">
            Select document
        </option>
    `;

    (data || []).forEach(documentType => {

        const option =
            document.createElement(
                "option"
            );

        option.value =
            documentType.id;

        option.textContent =
            documentType.document_name;

        select.appendChild(option);
    });

    select.disabled =
        !(data && data.length);

    select.onchange = function(){

        if(!this.value){

            if(fieldsBox){
                fieldsBox.innerHTML = "";
            }

            return;
        }

        const selectedOption =
            this.options[
                this.selectedIndex
            ];

        renderKycFields(
            selectedOption.textContent
        );

    };
}

function validateTool(){

    if(!selectedService){
        return false;
    }

    const name =
        selectedService.name;


    if(
        name === "🎬 Pics → Video" ||
        name === "Pics → Video"
    ){

        if(
            !document.getElementById(
                "picsVideoImage"
            )?.files.length
        ){

            alert(
                "Please upload a picture."
            );

            return false;
        }

        if(
            !document.getElementById(
                "picsVideoPrompt"
            )?.value.trim()
        ){

            alert(
                "Please describe the video."
            );

            return false;
        }
    }


    if(
        name === "🎭 Video Face Swap" ||
        name === "Video Face Swap"
    ){

        if(
            !document.getElementById(
                "faceSwapVideo"
            )?.files.length
        ){

            alert(
                "Please upload a video."
            );

            return false;
        }

        if(
            !document.getElementById(
                "faceSwapFace"
            )?.files.length
        ){

            alert(
                "Please upload the replacement face."
            );

            return false;
        }

        if(
            !document.getElementById(
                "faceSwapConsent"
            )?.checked
        ){

            alert(
                "Please confirm you have permission to use the face and video."
            );

            return false;
        }
    }


    if(
        name === "🎙️ AI Voice" ||
        name === "AI Voice"
    ){

        if(
            !document.getElementById(
                "aiVoiceText"
            )?.value.trim()
        ){

            alert(
                "Please enter the text."
            );

            return false;
        }
    }

/* =========================================================
   GENERATE / PURCHASE
========================================================= */

async function generateAI(){

    if(!currentUser){

        window.location.href =
            "login.html";

        return;
    }

    if(!selectedService){
        return;
    }

    if(!validateTool()){
        return;
    }

    await loadWallet();

    const price =
        Number(
            selectedService.price || 0
        );

    if(walletBalance < price){

        const difference =
            price -
            walletBalance;

        alert(
            "Insufficient wallet balance.\n\n" +

            "Price: " +
            formatMoney(price) +

            "\nBalance: " +
            formatMoney(walletBalance) +

            "\nYou need: " +
            formatMoney(difference) +
            " more."
        );

        return;
    }

    const button =
        document.querySelector(
            ".continue-btn"
        );

    const loading =
        document.getElementById(
            "loadingBox"
        );

    const result =
        document.getElementById(
            "resultBox"
        );

    if(button){
        button.disabled = true;
    }

    loading.classList.add("show");

    result.classList.remove("show");

    try{

        let payload = {};

        const name = selectedService.name;

        /* Upload user photo & gather form fields if service is KYC */
        if(
            name === "🪪 KYC / Document Designer" ||
            name === "KYC / Document Designer"
        ){
            const photoInput = document.getElementById("kycPhoto");
            let uploadedPhotoUrl = "";

            if(photoInput && photoInput.files.length > 0){
                const file = photoInput.files[0];
                const fileExt = file.name.split('.').pop();
                const fileName = `${currentUser.id}/${Date.now()}.${fileExt}`;

                const { data: storageData, error: storageError } =
                    await supabaseClient.storage
                        .from("kyc-uploads")
                        .upload(fileName, file);

                if(storageError){
                    console.error("Storage Upload Error:", storageError);
                    alert("Could not upload photo file. Please try again.");
                    return;
                }

                const { data: publicUrlData } = supabaseClient.storage
                    .from("kyc-uploads")
                    .getPublicUrl(fileName);

                uploadedPhotoUrl = publicUrlData?.publicUrl || "";
            }

            const countrySelect = document.getElementById("kycCountry");
            const docSelect = document.getElementById("kycDocument");

            payload = {
                country_id: countrySelect?.value || "",
                country_name: countrySelect?.options[countrySelect.selectedIndex]?.textContent || "",
                document_type_id: docSelect?.value || "",
                document_name: docSelect?.options[docSelect.selectedIndex]?.textContent || "",
                full_name: document.getElementById("kycFullName")?.value || "",
                dob: document.getElementById("kycDateOfBirth")?.value || "",
                nationality: document.getElementById("kycNationality")?.value || "",
                document_number: document.getElementById("kycDocumentNumber")?.value || "",
                issue_date: document.getElementById("kycIssueDate")?.value || "",
                expiry_date: document.getElementById("kycExpiryDate")?.value || "",
                address: document.getElementById("kycAddress")?.value || "",
                photo_url: uploadedPhotoUrl
            };
        }

        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "create_ai_purchase",
                {
                    p_service_id: selectedService.id,
                    p_payload: payload
                }
            );

        if(error){

            console.error(
                "AI purchase error:",
                error
            );

            alert(
                error.message ||
                "Could not start the AI job."
            );

            return;
        }

        if(
            !data ||
            data.success !== true
        ){

            alert(
                "The AI job could not be created."
            );

            return;
        }

        walletBalance =
            Number(
                data.wallet_balance || 0
            );

        document.getElementById(
            "walletBalance"
        ).textContent =
            formatMoney(
                walletBalance
            );

        result.innerHTML = `

            <strong>
                AI job created successfully ✓
            </strong>

            <br><br>

            Service:
            ${escapeHtml(
                data.service_name ||
                selectedService.name
            )}

            <br>

            Amount:
            ${formatMoney(
                data.price
            )}

            <br>

            Remaining wallet:
            ${formatMoney(
                data.wallet_balance
            )}

            <br><br>

            Job ID:
            ${escapeHtml(
                data.job_id
            )}

            <br><br>

            Your request has been added to the
            AI processing queue.

        `;

        result.classList.add("show");

    }catch(error){

        console.error(error);

        alert(
            "Something went wrong. Please try again."
        );

    }finally{

        loading.classList.remove("show");

        if(button){
            button.disabled = false;
        }
    }
}

supabaseClient.auth.onAuthStateChange(
    async (
        event,
        session
    ) => {

        if(
            event ===
            "SIGNED_OUT"
        ){

            window.location.href =
                "login.html";

            return;
        }

        if(session){

            currentUser =
                session.user;
        }
    }
);

========================================================= */

async function init(){

    const loggedIn =
        await checkLogin();

    if(!loggedIn){
        return;
    }

    await loadWallet();

    await loadServices();
}

init();
