<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Studio — Delight Vendor Logs</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f6f8;
  color:#111;
  font-family:Arial,Helvetica,sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.header{
  background:#050505;
  color:white;
  padding:16px;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 3px 15px rgba(0,0,0,.18);
}

.header-inner{
  max-width:900px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brand{
  font-weight:900;
  font-size:18px;
}

.brand small{
  display:block;
  color:#aaa;
  font-size:11px;
  margin-top:3px;
}

.back-btn{
  border:1px solid #444;
  background:#181818;
  color:#fff;
  padding:9px 13px;
  border-radius:10px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:18px 14px 50px;
}

.wallet{
  background:linear-gradient(135deg,#111,#242424);
  color:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.wallet-label{
  color:#aaa;
  font-size:12px;
}

.wallet-balance{
  font-size:28px;
  font-weight:900;
  margin-top:5px;
}

.section-title{
  font-size:21px;
  font-weight:900;
  margin:20px 0 12px;
}

.section-subtitle{
  color:#666;
  font-size:13px;
  margin-top:-5px;
  margin-bottom:14px;
}

/* SERVICES */

.services{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.service-card{
  background:white;
  border:1px solid #e5e5e5;
  border-radius:17px;
  padding:13px;
  display:flex;
  align-items:center;
  gap:14px;
  transition:.18s;
  box-shadow:0 3px 12px rgba(0,0,0,.04);
}

.service-card:hover{
  transform:translateY(-1px);
  box-shadow:0 7px 20px rgba(0,0,0,.08);
}

.service-visual{
  width:64px;
  height:64px;
  min-width:64px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#111;
  color:white;
}

.service-visual svg{
  width:40px;
  height:40px;
}

.service-info{
  flex:1;
  min-width:0;
}

.service-name{
  font-weight:900;
  font-size:16px;
}

.service-description{
  color:#777;
  font-size:12px;
  line-height:1.45;
  margin-top:4px;
}

.service-right{
  text-align:right;
  min-width:85px;
}

.service-price{
  font-weight:900;
  font-size:14px;
}

.open-label{
  color:#777;
  font-size:11px;
  margin-top:5px;
}

.empty{
  background:white;
  border:1px dashed #ccc;
  border-radius:15px;
  padding:25px;
  text-align:center;
  color:#777;
}

/* TOOL */

#toolPage{
  display:none;
}

.tool-top{
  background:white;
  border-radius:20px;
  padding:18px;
  border:1px solid #e5e5e5;
  margin-bottom:14px;
}

.tool-heading{
  display:flex;
  align-items:center;
  gap:14px;
}

.tool-logo{
  width:70px;
  height:70px;
  border-radius:18px;
  background:#111;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
}

.tool-logo svg{
  width:45px;
  height:45px;
}

.tool-title{
  font-size:23px;
  font-weight:900;
}

.tool-description{
  color:#666;
  font-size:13px;
  line-height:1.5;
  margin-top:5px;
}

.price-box{
  margin-top:18px;
  background:#f2f2f2;
  border-radius:15px;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.price-title{
  color:#777;
  font-size:12px;
}

.tool-price{
  font-size:22px;
  font-weight:900;
}

.balance-small{
  text-align:right;
}

.balance-small span{
  display:block;
  color:#777;
  font-size:11px;
}

.balance-small strong{
  font-size:14px;
}

.form-card{
  background:white;
  border:1px solid #e5e5e5;
  border-radius:20px;
  padding:18px;
}

.field{
  margin-bottom:16px;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:7px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid #d8d8d8;
  background:#fafafa;
  border-radius:12px;
  padding:12px;
  outline:none;
}

.field textarea{
  min-height:105px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:#111;
  background:white;
}

.file-input{
  background:#fafafa;
  padding:10px;
}

.help{
  color:#777;
  font-size:11px;
  margin-top:5px;
}

.consent{
  background:#fff8df;
  border:1px solid #ead58a;
  border-radius:13px;
  padding:12px;
  font-size:12px;
  line-height:1.45;
  margin-bottom:16px;
}

.consent label{
  display:flex;
  gap:9px;
  align-items:flex-start;
}

.consent input{
  margin-top:3px;
}

.sample-warning{
  background:#fff0f0;
  border:1px solid #e4aaaa;
  color:#8a1717;
  border-radius:13px;
  padding:12px;
  font-size:12px;
  line-height:1.45;
  margin-bottom:16px;
  font-weight:700;
}

.generate-box{
  margin-top:18px;
  border-top:1px solid #eee;
  padding-top:17px;
}

.generate-btn{
  width:100%;
  border:0;
  background:#050505;
  color:white;
  padding:15px;
  border-radius:13px;
  font-weight:900;
  font-size:15px;
}

.generate-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.generate-note{
  text-align:center;
  color:#777;
  font-size:11px;
  margin-top:8px;
}

.status{
  display:none;
  margin-bottom:14px;
  padding:13px;
  border-radius:13px;
  font-size:13px;
  font-weight:700;
}

.status.error{
  display:block;
  background:#fff0f0;
  color:#a00000;
  border:1px solid #efb0b0;
}

.status.success{
  display:block;
  background:#ecfff1;
  color:#08752d;
  border:1px solid #a8dfb9;
}

.status.info{
  display:block;
  background:#eef5ff;
  color:#1556a5;
  border:1px solid #b8d1f5;
}

.result{
  display:none;
  margin-top:16px;
  background:white;
  border:1px solid #ddd;
  border-radius:18px;
  padding:18px;
}

.result h3{
  margin:0 0 8px;
}

.result p{
  color:#666;
  font-size:13px;
  line-height:1.5;
}

.result-id{
  background:#f5f5f5;
  border-radius:10px;
  padding:10px;
  font-size:11px;
  word-break:break-all;
}

/* KYC */

.document-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:8px;
}

.document-option{
  border:1px solid #ddd;
  border-radius:13px;
  padding:13px;
  background:#fafafa;
  cursor:pointer;
  font-weight:800;
  font-size:13px;
}

.document-option:hover{
  border-color:#111;
  background:#f3f3f3;
}

.document-option.selected{
  border:2px solid #111;
  background:#f0f0f0;
}

@media(max-width:600px){
  .service-card{
    padding:11px;
  }

  .service-visual{
    width:55px;
    height:55px;
    min-width:55px;
  }

  .service-visual svg{
    width:34px;
    height:34px;
  }

  .service-name{
    font-size:14px;
  }

  .service-right{
    min-width:70px;
  }

  .service-price{
    font-size:12px;
  }

  .document-grid{
    grid-template-columns:1fr;
  }

  .tool-title{
    font-size:19px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-inner">
    <div>
      <div class="brand">⚡ Delight Vendor Logs</div>
      <small>AI Studio</small>
    </div>

    <button class="back-btn" id="backBtn" onclick="goBack()">
      ← Back
    </button>
  </div>
</header>

<main class="container">

  <div id="statusBox" class="status"></div>

  <div class="wallet">
    <div class="wallet-label">YOUR AI STUDIO WALLET</div>
    <div class="wallet-balance" id="walletBalance">₦0.00</div>
  </div>

  <!-- SERVICES PAGE -->
  <section id="servicesPage">

    <div class="section-title">AI Studio</div>
    <div class="section-subtitle">
      Choose a service to open the complete AI tool.
    </div>

    <div id="services" class="services"></div>

  </section>

  <!-- TOOL PAGE -->
  <section id="toolPage">

    <div class="tool-top">

      <div class="tool-heading">

        <div class="tool-logo" id="toolLogo"></div>

        <div>
          <div class="tool-title" id="toolTitle"></div>
          <div class="tool-description" id="toolDescription"></div>
        </div>

      </div>

      <!-- PRICE IS SHOWN AGAIN INSIDE THE TOOL -->
      <div class="price-box">

        <div>
          <div class="price-title">SERVICE PRICE</div>
          <div class="tool-price" id="toolPrice">₦0.00</div>
        </div>

        <div class="balance-small">
          <span>Wallet balance</span>
          <strong id="toolWalletBalance">₦0.00</strong>
        </div>

      </div>

    </div>

    <div class="form-card" id="toolForm"></div>

    <div id="resultBox" class="result"></div>

  </section>

</main>

<script>
const SUPABASE_URL =
  "https://hkfhehbhmucymusaytoe.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_O-aPnRtG3EZ6-Lwo8_sRuw_ZQqSQSF_";

const supabaseClient =
  supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let walletBalance = 0;
let aiServices = [];
let selectedService = null;

/* =========================================================
   TOOL DEFINITIONS
========================================================= */

const tools = {

  picsVideo:{
    description:"Turn an image into an AI-generated video with instructions, voice and language.",
    fields:"picsVideo"
  },

  faceSwap:{
    description:"Create a face-swap video using your selected source video and face image.",
    fields:"faceSwap"
  },

  voice:{
    description:"Generate AI speech from text using different voices and languages.",
    fields:"voice"
  },

  kyc:{
    description:"Design fictional document concepts such as passport, ID and license layouts.",
    fields:"kyc"
  },

  watermark:{
    description:"Remove unwanted visible watermark areas from supported images.",
    fields:"watermark"
  },

  voiceCloner:{
    description:"Create an AI voice from an uploaded voice sample and your text.",
    fields:"voiceCloner"
  },

  videoVoiceClone:{
    description:"Create a video using generated voice from your supplied source.",
    fields:"videoVoiceClone"
  },

  enhancer:{
    description:"Enhance and improve the quality of an image.",
    fields:"imageInstructions"
  },

  objectRemoval:{
    description:"Remove selected objects or backgrounds from an image.",
    fields:"imageInstructions"
  },

  outfit:{
    description:"Create an AI outfit edit from an uploaded image.",
    fields:"imageInstructions"
  },

  style:{
    description:"Transform an image into a selected AI visual style.",
    fields:"imageInstructions"
  },

  talkingPhoto:{
    description:"Turn a suitable portrait into a talking-photo concept.",
    fields:"talkingPhoto"
  }
};

const serviceToTool = {
  "🎬 Pics → Video":"picsVideo",
  "🎭 Video Face Swap":"faceSwap",
  "🎙️ AI Voice":"voice",
  "🪪 KYC / Document Designer":"kyc",
  "🧹 Watermark Removal":"watermark",
  "🗣️ Voice Cloner":"voiceCloner",
  "🎥 Video Voice Clone":"videoVoiceClone",
  "✨ AI Image Enhancer":"enhancer",
  "🖼️ Background / Object Removal":"objectRemoval",
  "👕 AI Outfit Editor":"outfit",
  "🎨 AI Image Style":"style",
  "🗣️ Talking Photo":"talkingPhoto"
};

/* =========================================================
   VISUAL LOGOS
========================================================= */

function svgForTool(tool){

  const svgs = {

    picsVideo:`
      <svg viewBox="0 0 64 64" fill="none">
        <rect x="8" y="12" width="38" height="40" rx="6" stroke="currentColor" stroke-width="4"/>
        <path d="M17 42l8-9 7 7 6-6 8 8" stroke="currentColor" stroke-width="4"/>
        <path d="M22 25a4 4 0 1 0 0 .1" stroke="currentColor" stroke-width="4"/>
        <path d="M48 18l2 5 5 2-5 2-2 5-2-5-5-2 5-2 2-5Z" fill="currentColor"/>
        <path d="M48 37l1 3 3 1-3 1-1 3-1-3-3-1 3-1 1-3Z" fill="currentColor"/>
      </svg>`,

    faceSwap:`
      <svg viewBox="0 0 64 64" fill="none">
        <circle cx="22" cy="25" r="11" stroke="currentColor" stroke-width="4"/>
        <circle cx="42" cy="39" r="11" stroke="currentColor" stroke-width="4"/>
        <path d="M30 18l7 2-4 5" stroke="currentColor" stroke-width="4"/>
        <path d="M34 46l-7-2 4-5" stroke="currentColor" stroke-width="4"/>
      </svg>`,

    voice:`
      <svg viewBox="0 0 64 64" fill="none">
        <rect x="23" y="8" width="18" height="31" rx="9" stroke="currentColor" stroke-width="4"/>
        <path d="M15 29a17 17 0 0 0 34 0M32 46v10M23 56h18" stroke="currentColor" stroke-width="4"/>
        <path d="M8 18v12M4 22v5M56 18v12M60 22v5" stroke="currentColor" stroke-width="3"/>
      </svg>`,

    kyc:`
      <svg viewBox="0 0 64 64" fill="none">
        <rect x="10" y="7" width="44" height="50" rx="6" stroke="currentColor" stroke-width="4"/>
        <rect x="17" y="17" width="14" height="17" rx="3" stroke="currentColor" stroke-width="3"/>
        <path d="M35 19h12M35 27h12M17 42h30" stroke="currentColor" stroke-width="3"/>
        <path d="M43 38l3 3 6-7" stroke="currentColor" stroke-width="4"/>
      </svg>`,

    watermark:`
      <svg viewBox="0 0 64 64" fill="none">
        <path d="M13 48l5-15L40 11l13 13-22 22-18 2Z" stroke="currentColor" stroke-width="4"/>
        <path d="M34 17l13 13M13 48l13-2" stroke="currentColor" stroke-width="4"/>
        <path d="M45 40l2 5 5 2-5 2-2 5-2-5-5-2 5-2 2-5Z" fill="currentColor"/>
      </svg>`,

    voiceCloner:`
      <svg viewBox="0 0 64 64" fill="none">
        <path d="M17 39V25a8 8 0 0 1 16 0v14a8 8 0 0 1-16 0Z" stroke="currentColor" stroke-width="4"/>
        <path d="M9 32a16 16 0 0 0 32 0M25 48v9M18 57h14" stroke="currentColor" stroke-width="4"/>
        <path d="M46 18v28M52 22v20M58 27v10" stroke="currentColor" stroke-width="3"/>
      </svg>`,

    videoVoiceClone:`
      <svg viewBox="0 0 64 64" fill="none">
        <rect x="7" y="12" width="36" height="40" rx="6" stroke="currentColor" stroke-width="4"/>
        <path d="M23 25l11 7-11 7V25Z" fill="currentColor"/>
        <path d="M48 19v27M54 23v19M60 28v9" stroke="currentColor" stroke-width="3"/>
      </svg>`,

    enhancer:`
      <svg viewBox="0 0 64 64" fill="none">
        <rect x="8" y="12" width="42" height="40" rx="6" stroke="currentColor" stroke-width="4"/>
        <path d="M14 43l10-11 8 8 7-7 8 9" stroke="currentColor" stroke-width="4"/>
        <path d="M47 9l2 6 6 2-6 2-2 6-2-6-6-2 6-2 2-6Z" fill="currentColor"/>
      </svg>`,

    objectRemoval:`
      <svg viewBox="0 0 64 64" fill="none">
        <rect x="8" y="12" width="48" height="40" rx="6" stroke="currentColor" stroke-width="4"/>
        <circle cx="22" cy="26" r="5" stroke="currentColor" stroke-width="3"/>
        <path d="M14 45l12-11 7 7 8-8 9 12" stroke="currentColor" stroke-width="4"/>
        <path d="M39 19l13 13M52 19L39 32" stroke="currentColor" stroke-width="4"/>
      </svg>`,

    outfit:`
      <svg viewBox="0 0 64 64" fill="none">
        <path d="M22 12l10 6 10-6 12 10-7 10-6-5v25H23V27l-6 5-7-10 12-10Z" stroke="currentColor" stroke-width="4"/>
      </svg>`,

    style:`
      <svg viewBox="0 0 64 64" fill="none">
        <path d="M15 47c-3-12 5-25 18-29 12-4 22 3 16 12-4 6-12 3-15 9-4 8-14 14-19 8Z" stroke="currentColor" stroke-width="4"/>
        <circle cx="22" cy="34" r="3" fill="currentColor"/>
        <circle cx="31" cy="25" r="3" fill="currentColor"/>
        <circle cx="40" cy="29" r="3" fill="currentColor"/>
        <path d="M49 10l2 5 5 2-5 2-2 5-2-5-5-2 5-2 2-5Z" fill="currentColor"/>
      </svg>`,

    talkingPhoto:`
      <svg viewBox="0 0 64 64" fill="none">
        <circle cx="28" cy="25" r="11" stroke="currentColor" stroke-width="4"/>
        <path d="M11 52c2-10 9-15 17-15s15 5 17 15" stroke="currentColor" stroke-width="4"/>
        <path d="M44 28h9a5 5 0 0 1 5 5v11a5 5 0 0 1-5 5h-5l-6 5v-5" stroke="currentColor" stroke-width="4"/>
        <path d="M48 36h6M48 42h4" stroke="currentColor" stroke-width="3"/>
      </svg>`
  };

  return svgs[tool] || svgs.enhancer;
}

/* =========================================================
   HELPERS
========================================================= */

function formatMoney(value){
  return "₦" + Number(value || 0).toLocaleString(
    "en-NG",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );
}

function showStatus(message,type="info"){
  const box=document.getElementById("statusBox");

  box.className="status " + type;
  box.textContent=message;
  box.style.display="block";
}

function hideStatus(){
  const box=document.getElementById("statusBox");
  box.style.display="none";
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

/* =========================================================
   LOGIN
========================================================= */

async function checkLogin(){

  const {
    data:{session}
  } = await supabaseClient.auth.getSession();

  if(!session){
    window.location.href="login.html";
    return false;
  }

  currentUser=session.user;
  return true;
}

/* =========================================================
   WALLET
========================================================= */

async function loadWallet(){

  if(!currentUser) return;

  const {
    data,
    error
  } = await supabaseClient
    .from("wallet")
    .select("balance")
    .eq('"user-id"',currentUser.id)
    .maybeSingle();

  if(error){
    console.error(error);
    walletBalance=0;
  }else{
    walletBalance=Number(data?.balance || 0);
  }

  document.getElementById("walletBalance").textContent=
    formatMoney(walletBalance);

  document.getElementById("toolWalletBalance").textContent=
    formatMoney(walletBalance);
}

/* =========================================================
   LOAD SERVICES
========================================================= */

async function loadServices(){

  const {
    data,
    error
  } = await supabaseClient
    .from("ai_services")
    .select("*")
    .eq("is_active",true)
    .order("sort_order",{ascending:true});

  if(error){
    console.error(error);
    showStatus("Unable to load AI services.", "error");
    return;
  }

  aiServices=data || [];
  renderServices();
}

/* =========================================================
   SERVICE LIST
========================================================= */

function renderServices(){

  const container=document.getElementById("services");

  if(!aiServices.length){
    container.innerHTML=
      `<div class="empty">No AI services are currently available.</div>`;
    return;
  }

  container.innerHTML=aiServices.map(service=>{

    const tool =
      serviceToTool[service.name] ||
      serviceToTool[
        String(service.name).replace(/^[^\w]+/,"").trim()
      ];

    const toolData=tools[tool] || {
      description:service.description || "AI service."
    };

    return `
      <div class="service-card"
           onclick="openTool('${service.id}')">

        <div class="service-visual">
          ${svgForTool(tool)}
        </div>

        <div class="service-info">

          <div class="service-name">
            ${escapeHtml(service.name)}
          </div>

          <div class="service-description">
            ${escapeHtml(
              service.description ||
              toolData.description ||
              "AI service."
            )}
          </div>

        </div>

        <div class="service-right">

          <div class="service-price">
            ${formatMoney(service.price)}
          </div>

          <div class="open-label">
            Open →
          </div>

        </div>

      </div>
    `;

  }).join("");
}

/* =========================================================
   OPEN TOOL
========================================================= */

function openTool(serviceId){

  selectedService =
    aiServices.find(x=>String(x.id)===String(serviceId));

  if(!selectedService){
    showStatus("Service not found.", "error");
    return;
  }

  const tool =
    serviceToTool[selectedService.name] ||
    serviceToTool[
      String(selectedService.name)
        .replace(/^[^\w]+/,"")
        .trim()
    ];

  if(!tool){
    showStatus("This AI tool is not configured yet.", "error");
    return;
  }

  document.getElementById("servicesPage").style.display="none";
  document.getElementById("toolPage").style.display="block";

  document.getElementById("toolLogo").innerHTML=
    svgForTool(tool);

  document.getElementById("toolTitle").textContent=
    selectedService.name;

  document.getElementById("toolDescription").textContent=
    selectedService.description ||
    tools[tool]?.description ||
    "";

  /*
    IMPORTANT:
    PRICE IS SHOWN AGAIN INSIDE THE TOOL.
  */

/* =========================================================
   VALIDATE TOOL
========================================================= */

function validateTool(){

  const tool =
    serviceToTool[selectedService.name] ||
    serviceToTool[
      String(selectedService.name)
        .replace(/^[^\w]+/,"")
        .trim()
    ];

  if(tool==="picsVideo"){

    if(!document.getElementById("pvImage").files.length)
      return "Please upload a picture.";

    if(!document.getElementById("pvPrompt").value.trim())
      return "Please describe what you want the video to do.";

    if(!document.getElementById("pvVoice").value)
      return "Please select a voice.";

    if(!document.getElementById("pvLanguage").value)
      return "Please select a language.";
  }

  if(tool==="faceSwap"){

    if(!document.getElementById("fsVideo").files.length)
      return "Please upload the source video.";

    if(!document.getElementById("fsFace").files.length)
      return "Please upload the face image.";

    if(!document.getElementById("fsConsent").checked)
      return "Please confirm that you have permission to use the uploaded material.";
  }

  if(tool==="voice"){

    if(!document.getElementById("voiceText").value.trim())
      return "Please enter the text.";

    if(!document.getElementById("voiceLanguage").value)
      return "Please select a language.";
  }

  if(tool==="kyc"){

    if(!document.getElementById("kycDocument").value)
      return "Please select a document type.";

    if(!document.getElementById("kycCountry").value)
      return "Please select a country or region.";

    if(!document.getElementById("kycName").value.trim())
      return "Please enter a fictional sample name.";

    if(!document.getElementById("kycConsent").checked)
      return "Please confirm that this is a fictional/sample design.";
  }

  if(tool==="watermark"){

    if(!document.getElementById("wmImage").files.length)
      return "Please upload an image.";

    if(!document.getElementById("wmTarget").value.trim())
      return "Please describe the watermark area.";
  }

  if(tool==="voiceCloner"){

    if(!document.getElementById("vcSample").files.length)
      return "Please upload a voice sample.";

    if(!document.getElementById("vcText").value.trim())
      return "Please enter the text.";

    if(!document.getElementById("vcLanguage").value)
      return "Please select a language.";

    if(!document.getElementById("vcConsent").checked)
      return "Please confirm that you have permission to use the voice.";
  }

  if(tool==="videoVoiceClone"){

    if(!document.getElementById("vvcSource").files.length)
      return "Please upload the source voice.";

    if(!document.getElementById("vvcVisual").files.length)
      return "Please upload the visual.";

    if(!document.getElementById("vvcText").value.trim())
      return "Please enter the text.";

    if(!document.getElementById("vvcLanguage").value)
      return "Please select a language.";

    if(!document.getElementById("vvcConsent").checked)
      return "Please confirm that you have permission to use the voice and visual.";
  }

  if(tool==="enhancer"){

    if(!document.getElementById("enhImage").files.length)
      return "Please upload an image.";
  }

  if(tool==="objectRemoval"){

    if(!document.getElementById("orImage").files.length)
      return "Please upload an image.";

    if(!document.getElementById("orInstructions").value.trim())
      return "Please describe what should be removed.";
  }

  if(tool==="outfit"){

    if(!document.getElementById("outfitImage").files.length)
      return "Please upload an image.";

    if(!document.getElementById("outfitInstructions").value.trim())
      return "Please describe the outfit.";
  }

  if(tool==="style"){

    if(!document.getElementById("styleImage").files.length)
      return "Please upload an image.";
  }

  if(tool==="talkingPhoto"){

    if(!document.getElementById("tpImage").files.length)
      return "Please upload a portrait.";

    if(!document.getElementById("tpText").value.trim())
      return "Please enter the text.";

    if(!document.getElementById("tpLanguage").value)
      return "Please select a language.";
  }

  return null;
}

/* =========================================================
   PURCHASE + JOB CREATION
========================================================= */

async function preparePurchase(){

  hideStatus();

  if(!selectedService){
    showStatus("Please select an AI service first.","error");
    return;
  }

  const validationError=validateTool();

  if(validationError){
    showStatus(validationError,"error");
    return;
  }

  const button=document.getElementById("generateBtn");

  if(button){
    button.disabled=true;
    button.textContent="Checking wallet...";
  }

  /*
    Refresh wallet immediately before purchase.
    This prevents using an old displayed balance.
  */

  await loadWallet();

  const price=Number(selectedService.price || 0);

  if(walletBalance < price){

    const difference=price-walletBalance;

    if(button){
      button.disabled=false;
      button.textContent=
        `Generate — ${formatMoney(price)}`;
    }

    showStatus(
      `Insufficient funds. You need ${formatMoney(difference)} more in your wallet.`,
      "error"
    );

    return;
  }

  if(button){
    button.textContent="Processing payment...";
  }

  /*
    IMPORTANT:
    The database RPC is responsible for the actual deduction.
    Never deduct the wallet manually from the browser.
  */

  const {
    data,
    error
  } = await supabaseClient.rpc(
    "create_ai_purchase",
    {
      p_service_id:selectedService.id
    }
  );

  if(error){

    console.error(error);

    if(button){
      button.disabled=false;
      button.textContent=
        `Generate — ${formatMoney(price)}`;
    }

    showStatus(
      error.message || "Unable to process the purchase.",
      "error"
    );

    return;
  }

  if(!data || !data.success){

    if(button){
      button.disabled=false;
      button.textContent=
        `Generate — ${formatMoney(price)}`;
    }

    showStatus(
      "The AI purchase could not be completed.",
      "error"
    );

    return;
  }

  /*
    Update wallet from the exact value returned by
    the secure RPC.
  */

  walletBalance=Number(data.wallet_balance || 0);

  document.getElementById("walletBalance").textContent=
    formatMoney(walletBalance);

  document.getElementById("toolWalletBalance").textContent=
    formatMoney(walletBalance);

  if(button){
    button.textContent="Job submitted";
  }

  showStatus(
    "Payment successful. Your AI job has been submitted.",
    "success"
  );

  showJobResult(data);
}

========================================================= */

  box.style.display="block";

  box.innerHTML=`

    <h3>⚡ AI job submitted</h3>

    <p>
      Your payment has been completed and the AI job has been
      created successfully.
    </p>

    <p>
      <strong>Service:</strong>
      ${escapeHtml(data.service_name)}
    </p>

    <p>
      <strong>Amount:</strong>
      ${formatMoney(data.price)}
    </p>

    <p>
      <strong>Status:</strong>
      Processing / queued
    </p>

    <div class="result-id">
      Job ID: ${escapeHtml(data.job_id)}
    </div>

========================================================= */

    document.getElementById("toolPage");

  if(toolPage.style.display==="block"){

    toolPage.style.display="none";
    document.getElementById("servicesPage").style.display="block";

    selectedService=null;

    hideStatus();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

    return;
  }

  window.location.href="dashboard.html";
}

/* =========================================================
   START
========================================================= */

async function start(){

  const loggedIn=await checkLogin();

  if(!loggedIn) return;

  await loadWallet();
  await loadServices();
}

supabaseClient.auth.onAuthStateChange(
  async(event,session)=>{

    if(event==="SIGNED_OUT"){
      window.location.href="login.html";
    }

  }
);

start();
